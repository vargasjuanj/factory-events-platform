<mat-toolbar color="primary" class="mat-elevation-z2">
  <mat-icon class="toolbar-icon">precision_manufacturing</mat-icon>
  <span>Gestión de Eventos de Planta</span>
</mat-toolbar>

<mat-progress-bar
  *ngIf="eventService.loading$ | async"
  mode="indeterminate"
></mat-progress-bar>

<div class="grid-container">

  <mat-card class="mat-elevation-z2">
    <mat-card-header>
      <mat-card-title>Registrar Evento</mat-card-title>
    </mat-card-header>

    <mat-card-content>
      <app-event-form
        [isSubmitting]="isSubmitting"
        (submitEvent)="onEventSubmit($event)"
      ></app-event-form>
    </mat-card-content>
  </mat-card>

  <mat-card class="mat-elevation-z2">
    <mat-card-content>

      <mat-tab-group animationDuration="0ms">

        <mat-tab [label]="'Eventos (' + ((eventService.events$ | async)?.length || 0) + ')'">
          <app-dynamic-crud-table
            [columns]="eventColumns"
            [data]="(eventService.events$ | async) || []"
            emptyMessage="No se han registrado eventos todavía."
          ></app-dynamic-crud-table>
        </mat-tab>

        <mat-tab [label]="'Auditorías de Calidad (' + ((eventService.audits$ | async)?.length || 0) + ')'">
          <app-dynamic-crud-table
            [columns]="auditColumns"
            [data]="(eventService.audits$ | async) || []"
            emptyMessage="No hay registros de auditoría de calidad."
          ></app-dynamic-crud-table>
        </mat-tab>

      </mat-tab-group>

    </mat-card-content>
  </mat-card>

</div>
